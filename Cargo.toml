[package]
name = "kafka-message-size-tracker"
version = "0.1.0"
edition = "2024"
description = "Real-time Kafka message size tracking dashboard with alerts and analytics"

[features]
default = ["static-kafka"]
static-kafka = ["rdkafka/cmake-build", "rdkafka/ssl"]
dynamic-kafka = ["rdkafka/dynamic-linking", "rdkafka/ssl"]

[dependencies]
actix-web = "4"
actix-ws = "0.3"
actix-rt = "2"
actix-cors = "0.7"
rdkafka = "0.37"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
rand = "0.8"
base64 = "0.22"
mongodb = "3"
