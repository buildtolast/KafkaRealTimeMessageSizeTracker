services:
  # ═══════════════════════════════════════════════════════════════════
  #   KAFKA CLUSTER — 5 nodes (KRaft mode, no ZooKeeper)
  #   Nodes 1-3: broker + controller (quorum voters)
  #   Nodes 4-5: broker only
  # ═══════════════════════════════════════════════════════════════════
  kafka-1:
    image: apache/kafka:3.7.0
    container_name: kafka-size-tracker-kafka-1
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      CLUSTER_ID: "kafka-size-tracker-cluster"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tracker-net

  kafka-2:
    image: apache/kafka:3.7.0
    container_name: kafka-size-tracker-kafka-2
    ports:
      - "9095:9094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      CLUSTER_ID: "kafka-size-tracker-cluster"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tracker-net

  kafka-3:
    image: apache/kafka:3.7.0
    container_name: kafka-size-tracker-kafka-3
    ports:
      - "9096:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      CLUSTER_ID: "kafka-size-tracker-cluster"
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tracker-net

  kafka-4:
    image: apache/kafka:3.7.0
    container_name: kafka-size-tracker-kafka-4
    ports:
      - "9097:9094"
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-4:9092,EXTERNAL://localhost:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      CLUSTER_ID: "kafka-size-tracker-cluster"
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tracker-net

  kafka-5:
    image: apache/kafka:3.7.0
    container_name: kafka-size-tracker-kafka-5
    ports:
      - "9098:9094"
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-5:9092,EXTERNAL://localhost:9098
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      CLUSTER_ID: "kafka-size-tracker-cluster"
    depends_on:
      kafka-1:
        condition: service_healthy
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tracker-net

  # ═══════════════════════════════════════════════════════════════════
  #   MONGODB REPLICA SET — 3 nodes
  # ═══════════════════════════════════════════════════════════════════
  mongo-1:
    image: mongo:7
    container_name: kafka-size-tracker-mongo-1
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo-data-1:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - tracker-net

  mongo-2:
    image: mongo:7
    container_name: kafka-size-tracker-mongo-2
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo-data-2:/data/db
    depends_on:
      mongo-1:
        condition: service_healthy
    networks:
      - tracker-net

  mongo-3:
    image: mongo:7
    container_name: kafka-size-tracker-mongo-3
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - mongo-data-3:/data/db
    depends_on:
      mongo-1:
        condition: service_healthy
    networks:
      - tracker-net

  mongo-init:
    image: mongo:7
    container_name: kafka-size-tracker-mongo-init
    depends_on:
      mongo-1:
        condition: service_healthy
      mongo-2:
        condition: service_started
      mongo-3:
        condition: service_started
    entrypoint: >
      mongosh --host mongo-1:27017 --eval '
        try {
          rs.status();
          print("Replica set already initialized");
        } catch(e) {
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo-1:27017", priority: 2 },
              { _id: 1, host: "mongo-2:27017", priority: 1 },
              { _id: 2, host: "mongo-3:27017", priority: 1 }
            ]
          });
          print("Replica set initiated");
        }
      '
    restart: "no"
    networks:
      - tracker-net

  # ═══════════════════════════════════════════════════════════════════
  #   APPLICATION + SEED PRODUCER
  # ═══════════════════════════════════════════════════════════════════
  tracker:
    build: .
    container_name: kafka-size-tracker
    ports:
      - "5688:5688"
    environment:
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092,kafka-4:9092,kafka-5:9092
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "5688"
      RUST_LOG: info
      ALERT_THRESHOLD_BYTES: "1048576"
      CRITICAL_THRESHOLD_BYTES: "10485760"
      MONGO_URI: "mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/?replicaSet=rs0"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      mongo-1:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - tracker-net
    restart: unless-stopped

  seed-producer:
    image: apache/kafka:3.7.0
    container_name: kafka-size-tracker-seed
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./scripts/seed-sizes.sh:/scripts/seed-sizes.sh
    entrypoint: ["/bin/bash", "/scripts/seed-sizes.sh"]
    environment:
      KAFKA_BROKER: kafka-1:9092
    networks:
      - tracker-net

volumes:
  mongo-data-1:
  mongo-data-2:
  mongo-data-3:

networks:
  tracker-net:
    driver: bridge
